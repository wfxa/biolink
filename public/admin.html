<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacy counter · {{SITE}}</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
/* Owner panel: tab rail on the left, the selected tool on the right. */
body{min-height:100vh}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;width:min(1260px,100% - 32px);margin:26px auto 80px}
.rail{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:22px;border:1px solid transparent;background:linear-gradient(180deg,rgba(22,27,31,.7),rgba(12,15,18,.7)) padding-box,linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04)) border-box;backdrop-filter:blur(20px)}
.rail .tag-mono{padding:4px 10px 10px}
.rail button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:999px;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-align:left;transition:all .2s}
.rail button svg{width:15px;height:15px;fill:currentColor}
.rail button:hover{color:var(--text);background:var(--glass-2)}
.rail button[aria-current=true]{color:#fff;background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.rail .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--on-accent)}
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:40px}
.view{display:flex;flex-direction:column;gap:14px;animation:viewin .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kpi{position:relative;padding:16px;border-radius:18px;border:1px solid transparent;background:linear-gradient(180deg,rgba(22,27,31,.72),rgba(12,15,18,.72)) padding-box,linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04)) border-box}
.kpi small{color:var(--muted);font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-family:var(--display);font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi.alert{border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.chart{width:100%;height:170px}
.chart text{fill:var(--dim);font-size:10px;font-family:var(--mono)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini td{padding:7px 0;border-bottom:1px dashed var(--line-2)}
.mini td:last-child{text-align:right;font-family:var(--mono);color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{max-width:280px}
.tblwrap{overflow-x:auto;border:1px solid transparent;border-radius:20px;background:linear-gradient(180deg,rgba(22,27,31,.7),rgba(12,15,18,.7)) padding-box,linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04)) border-box;backdrop-filter:blur(20px)}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:12px 14px;border-bottom:1px solid var(--line)}
.t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer;transition:background .2s}.t tbody tr:hover{background:rgba(255,255,255,.035)}
.t tr.banned td{opacity:.55}
.t td.num{font-family:var(--mono);color:var(--muted);font-size:12px}
.who{display:flex;flex-direction:column}.who small{color:var(--dim);font-size:11px}
/* user drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:80;background:rgba(10,13,15,.94);backdrop-filter:blur(30px);border-left:1px solid var(--line-2);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 60px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h3{font-size:22px}
.drawer .body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.drawer .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drawer .facts div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.drawer .facts small{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.drawer .facts b{font-size:13.5px}
.drawer .sec{display:flex;flex-direction:column;gap:8px}
.drawer .sec > .tag-mono{margin-bottom:2px}
.drawer .acts{display:flex;flex-wrap:wrap;gap:8px}
.scrim{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.bpick{display:flex;flex-wrap:wrap;gap:6px}
.bpick label{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);font-size:12px;cursor:pointer}
.bpick label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.bpick input{display:none}
.bpick svg{width:13px;height:13px;fill:currentColor}
/* reports */
.rep{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:16px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line)}
.rep .reason{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent-hi);white-space:nowrap}
.rep p{color:var(--muted);font-size:13px;margin-top:4px;white-space:pre-wrap}
.rep .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:40px;text-align:center;border:1px dashed var(--line-2);border-radius:20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
/* badges & invites */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.bcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.bcard .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line-2)}
.bcard svg{width:18px;height:18px;fill:currentColor}
.bcard div{flex:1;min-width:0}.bcard small{display:block;color:var(--muted);font-size:11.5px}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.iconpick button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:rgba(255,255,255,.03);cursor:pointer;display:grid;place-items:center}
.iconpick button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.iconpick svg{width:16px;height:16px;fill:currentColor}
.code{font-family:var(--mono);font-size:13px;letter-spacing:.04em}
.log{display:flex;flex-direction:column}
.log .e{display:grid;grid-template-columns:120px 1fr auto;gap:12px;padding:10px 14px;border-bottom:1px dashed var(--line);font-size:13px}
.log .e:last-child{border-bottom:0}
.log .e time{font-family:var(--mono);font-size:11px;color:var(--dim)}
.log .e span.d{color:var(--muted);font-size:12px}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.danger-zone{border-color:rgba(255,107,127,.35)!important}
/* bulk actions */
.t .ck{width:34px;padding-right:0}
.t .ck input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.bulk{position:sticky;bottom:16px;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px 10px 18px;border-radius:999px;
  background:rgba(12,15,18,.92);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:0 20px 50px -18px rgba(0,0,0,.9),0 0 0 4px color-mix(in srgb,var(--accent) 8%,transparent);backdrop-filter:blur(16px)}
.bulk b{font-size:13px;margin-right:6px}
#bulk select,#bulk input{height:34px;padding:0 12px;border-radius:999px;font-size:12.5px;width:auto;flex:none;max-width:220px}
.newcodes{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding:12px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.newcodes textarea{font-family:var(--mono);font-size:13px;resize:vertical}
.newcodes button{align-self:flex-start}
@media (max-width:980px){.shell{grid-template-columns:1fr}.rail{position:static;flex-direction:row;overflow-x:auto}.rail .tag-mono{display:none}.kpis{grid-template-columns:1fr 1fr}.two,.setgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/"><i></i>{{SITE}}</a><nav><a href="/dashboard">My page</a><a href="#" onclick="logout();return false">Sign out</a></nav></header>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main><div class="head"><div><span class="tag-mono" id="roleNote"></span><h1 id="title">Counter</h1></div><div id="headActs"></div></div><div id="view"></div></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Patient details"></aside>
<script src="/assets/icons.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/admin.js"></script>
<script src="/assets/fx.js"></script>
</body>
</html>
