<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top shelf · {{SITE}}</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.wrap{width:min(720px,100% - 32px);margin:40px auto}
h1{font-size:48px;margin-bottom:6px}
ol{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:24px}
li a{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s}
li a:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent);transform:translateX(4px);box-shadow:0 0 30px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
li:nth-child(1) a{border-color:rgba(255,210,61,.5);box-shadow:0 0 40px -14px rgba(255,210,61,.7)}
.rank{width:28px;font-family:var(--display);font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
li:nth-child(1) .rank{color:#ffcc4d}li:nth-child(2) .rank{color:#d7d7e0}li:nth-child(3) .rank{color:#ff8a3d}
.av{width:42px;height:42px;border-radius:50%;background:var(--ink-3);display:grid;place-items:center;overflow:hidden;font-weight:700;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0}
.who b{display:flex;gap:6px;align-items:center}
.who b svg{width:13px;height:13px}
.who small{color:var(--muted);font-size:11.5px}
.v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/"><i></i>{{SITE}}</a><nav><a href="/">Home</a><a class="btn small" href="/dashboard">Dashboard</a></nav></header>
<main class="wrap">
  <span class="tag-mono">most visited</span>
  <h1>Top shelf</h1>
  <p class="muted">The pages people keep coming back to. Each visitor counts once a day.</p>
  <ol id="list"><li class="muted">Loading…</li></ol>
</main>
<script src="/assets/icons.js"></script>
<script src="/assets/common.js"></script>
<script>
api("/api/leaderboard").then((rows) => {
  document.getElementById("list").innerHTML = rows.length ? rows.map((r, i) => `<li><a href="/${esc(r.username)}">
    <span class="rank">${i + 1}</span>
    <span class="av">${r.avatar ? `<img src="${esc(r.avatar)}" alt="">` : esc((r.displayName || r.username).slice(0, 2))}</span>
    <span class="who"><b>${esc(r.displayName || r.username)} ${r.badges.slice(0, 4).map((b) => `<span style="color:${esc(b.color)}" title="${esc(b.name)}">${svgIcon(b.icon)}</span>`).join("")}</b>
      <small>/${esc(r.username)} · #${r.memberNo}</small></span>
    <span class="v">${r.views.toLocaleString()} visits</span></a></li>`).join("") : `<li class="muted">The shelf is empty. <a href="/signup">Fill the first prescription.</a></li>`;
});
</script>
<style>.who svg{fill:currentColor}</style>
<script src="/assets/fx.js"></script>
</body>
</html>
